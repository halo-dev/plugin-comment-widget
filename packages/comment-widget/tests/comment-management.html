<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Comment management regression checks</title>
<body>
<pre id="result">Running…</pre>
<script type="module">
// Run after `pnpm -C packages/comment-widget build`, using a local HTTP server.
const comment = {
  metadata: { name: 'comment-1' },
  spec: { content: 'Comment', approved: true, hidden: false, owner: { kind: 'User', name: 'admin' } },
  owner: { displayName: 'Admin' }, stats: { upvote: 0 }, status: { visibleReplyCount: 1 },
};
const reply = {
  ...structuredClone(comment), metadata: { name: 'reply-1' },
  spec: { ...comment.spec, content: 'Reply', commentName: 'comment-1' },
};
let deletedReply = false;
let deletedComment = false;
let lastPage = false;
let confirmation = '';
const requests = [];
const list = (items, page = 1, total = items.length) => ({
  items, page, size: 20, total, totalPages: Math.ceil(total / 20),
  first: page === 1, last: page >= Math.ceil(total / 20),
  hasNext: page < Math.ceil(total / 20), hasPrevious: page > 1,
});
window.confirm = (message) => { confirmation = message; return true; };
window.fetch = async (input, options = {}) => {
  const url = new URL(String(input), location.href);
  requests.push(url);
  let data = {};
  if (options.method === 'DELETE') {
    if (url.pathname.includes('/replies/')) deletedReply = true;
    else deletedComment = true;
  } else if (options.method === 'PATCH') {
    const target = url.pathname.includes('/replies/') ? reply : comment;
    for (const patch of JSON.parse(options.body)) target.spec[patch.path.split('/').at(-1)] = patch.value;
  } else if (url.pathname.endsWith('/globalinfo')) data = { allowAnonymousComments: true };
  else if (url.pathname.endsWith('/config')) data = { basic: { withReplies: true }, avatar: { enable: false } };
  else if (url.pathname.endsWith('/permissions')) data = { uiPermissions: ['system:comments:manage'] };
  else if (url.pathname.endsWith('/users/-')) data = { user: { metadata: { name: 'admin' }, spec: {} } };
  else if (url.pathname === '/apis/api.console.halo.run/v1alpha1/replies') {
    const selectors = url.searchParams.getAll('fieldSelector');
    if (!['spec.approved=true', 'spec.hidden=false', '!metadata.deletionTimestamp'].every(s => selectors.includes(s))) throw new Error('Missing visible reply filters');
    data = { total: Number(!deletedReply && reply.spec.approved && !reply.spec.hidden) };
  } else if (url.pathname.endsWith('/reply')) data = list(deletedReply ? [] : [reply]);
  else if (url.pathname.endsWith('/comments')) {
    const page = Number(url.searchParams.get('page'));
    // Keep status stale, as when ReplyEventReconciler has not run yet.
    data = lastPage
      ? list(deletedComment ? (page === 2 ? [] : [{ ...comment, metadata: { name: 'previous-comment' } }]) : [comment], page, deletedComment ? 20 : 21)
      : list([comment]);
  }
  return new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } });
};
const assert = (condition, message) => { if (!condition) throw new Error(message); };
async function until(predicate) {
  for (let i = 0; i < 100; i++) {
    if (predicate()) return;
    await new Promise(resolve => setTimeout(resolve, 20));
  }
  throw new Error('Timed out waiting for UI');
}
try {
  await import('../dist/index.js');
  const widget = document.createElement('comment-widget');
  document.body.append(widget);
  await until(() => widget.shadowRoot?.querySelector('comment-list')?.comments.items.length);
  const comments = widget.shadowRoot.querySelector('comment-list');
  const item = comments.shadowRoot.querySelector('comment-item');
  await until(() => item.shadowRoot?.querySelector('comment-replies')?.shadowRoot?.querySelector('reply-item'));
  const replies = item.shadowRoot.querySelector('comment-replies');
  const management = replies.shadowRoot.querySelector('reply-item').shadowRoot.querySelector('comment-management');
  await management.updateComplete;
  management.shadowRoot.querySelector('summary').click();
  management.shadowRoot.querySelectorAll('button')[1].click();
  await until(() => item.comment.status.visibleReplyCount === 0);
  assert(comment.status.visibleReplyCount === 1, 'Fixture must retain stale server status');
  assert(reply.spec.hidden, 'Reply should be hidden');

  management.shadowRoot.querySelector('summary').click();
  const deleteButton = management.shadowRoot.querySelectorAll('button')[2];
  deleteButton.focus();
  deleteButton.click();
  await until(() => !management.isConnected);
  assert(confirmation === 'Delete this reply? This cannot be undone.', 'Reply deletion scope is incorrect');
  assert(widget.shadowRoot.activeElement === comments, 'Deleted reply must hand focus to the list');

  lastPage = true;
  await comments.fetchComments({ page: 2 });
  await comments.updateComplete;
  const rootManagement = comments.shadowRoot.querySelector('comment-item').shadowRoot.querySelector('comment-management');
  await rootManagement.updateComplete;
  rootManagement.shadowRoot.querySelector('summary').click();
  const rootDelete = rootManagement.shadowRoot.querySelectorAll('button')[2];
  rootDelete.focus();
  rootDelete.click();
  await until(() => deletedComment && comments.comments.page === 1);
  assert(comments.comments.items.length === 1, 'Deletion must return to a populated valid page');
  await comments.updateComplete;
  assert(!rootManagement.isConnected, 'Deleted comment must be removed');
  assert(widget.shadowRoot.activeElement === comments, 'Pagination fallback must retain list focus');
  assert(confirmation === 'Delete this comment and its replies? This cannot be undone.', 'Comment deletion scope is incorrect');
  document.querySelector('#result').textContent = 'PASS: reply count, deletion confirmation, focus, and pagination';
} catch (error) {
  document.querySelector('#result').textContent = `FAIL: ${error.stack}`;
  throw error;
}
</script>
</body>
</html>
