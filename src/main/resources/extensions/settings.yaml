apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-comment-widget-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: number
          label: 评论分页条数
          name: size
          validation: required
          value: 20
        - $formkit: number
          label: 回复分页条数
          name: replySize
          id: replySize
          key: replySize
          min: 1
          step: 1
          validation: required|min:1
          value: 10
        - $formkit: checkbox
          label: 同时加载评论的回复
          name: withReplies
          id: withReplies
          key: withReplies
          value: false
        - $formkit: number
          label: 同时加载回复的条数
          if: "$get(withReplies).value === true"
          name: withReplySize
          id: withReplySize
          key: withReplySize
          min: 1
          max: "$get(replySize).value"
          step: 1
          validation: required|min:1
          help: 不能大于回复分页条数
          value: 5
        - $formkit: checkbox
          label: 显示评论者设备信息
          name: showCommenterDevice
          value: false
        - $formkit: checkbox
          label: 支持私密评论
          id: enablePrivateComment
          key: enablePrivateComment
          name: enablePrivateComment
          help: 开启之后，评论者可选是否私密评论，私密评论仅评论者（已登录）和网站管理员（包含评论查看权限）可见，
          value: false
        - $formkit: checkbox
          if: "$get(enablePrivateComment).value === true"
          label: 显示私密评论状态
          name: showPrivateCommentBadge
          id: showPrivateCommentBadge
          key: showPrivateCommentBadge
          value: true
          help: 开启后，私密评论会显示一个私密状态标识
    - group: security
      label: 安全设置
      formSchema:
        - $formkit: group
          name: captcha
          label: 验证码
          value:
            enable: false
            type: ALPHANUMERIC
          children:
            - $formkit: checkbox
              label: 启用验证码
              name: enable
              id: captchaEnable
              key: captchaEnable
              value: false
            - $formkit: select
              if: "$get(captchaEnable).value === true"
              label: 需要验证码的用户
              name: audience
              id: captchaAudience
              key: captchaAudience
              value: ANONYMOUS
              validation: required
              options:
                - label: 所有用户
                  value: ALL
                - label: 匿名用户
                  value: ANONYMOUS
                - label: 按照角色选择用户
                  value: ROLES
            - $formkit: roleSelect
              if: "$get(captchaEnable).value === true && $get(captchaAudience).value === ROLES"
              label: 用户角色
              name: roles
              key: captchaRoles
              multiple: true
              value: []
              validation: required
              help: 拥有任一所选角色的用户提交评论或回复时需要验证码
            - $formkit: checkbox
              if: "$get(captchaEnable).value === true && $get(captchaAudience).value === ROLES"
              label: 同时包含匿名用户
              name: includeAnonymous
              key: captchaIncludeAnonymous
              value: false
              help: 勾选后，未登录用户提交评论或回复时也需要验证码
            - $formkit: select
              label: 验证码类型
              if: "$get(captchaEnable).value === true"
              name: type
              id: type
              key: captchaType
              value: "ALPHANUMERIC"
              help: Cloudflare Turnstile 官方文档
              __raw__sectionsSchema:
                help:
                  if: "$value === TURNSTILE || $value === ALTCHA"
                  children:
                    - $el: span
                      if: "$value === ALTCHA"
                      children: ALTCHA 仅支持在 HTTPS 环境下使用。
                    - $el: a
                      if: "$value === ALTCHA"
                      children: ALTCHA 官方文档
                      attrs:
                        href: https://altcha.org/docs/
                        target: _blank
                        rel: noopener noreferrer
                        class: underline
                    - $el: a
                      if: "$value === TURNSTILE"
                      children: Cloudflare Turnstile 官方文档
                      attrs:
                        href: https://developers.cloudflare.com/turnstile/get-started/
                        target: _blank
                        rel: noopener noreferrer
                        class: underline
              options:
                - label: 字母数字组合
                  value: "ALPHANUMERIC"
                - label: 算术验证码
                  value: "ARITHMETIC"
                - label: Cloudflare Turnstile
                  value: "TURNSTILE"
                - label: ALTCHA
                  value: "ALTCHA"
            - $formkit: radio
              if: "$get(captchaEnable).value === true && $get(type).value === ALTCHA"
              name: altchaDisplay
              label: ALTCHA 显示模式
              value: floating
              key: altchaDisplay
              help: 标准模式需要用户手动点击验证；自动模式在用户提交时自动验证，以浮层展示验证进度和结果。
              options:
                - label: 标准模式
                  value: standard
                - label: 自动模式
                  value: floating
            - $formkit: checkbox
              if: "$get(captchaEnable).value === true && $get(type).value === ALTCHA"
              name: altchaHideLogo
              key: altchaHideLogo
              label: 隐藏 ALTCHA 标志
              value: false
            - $formkit: checkbox
              if: "$get(captchaEnable).value === true && $get(type).value === ALTCHA"
              name: altchaHideFooter
              key: altchaHideFooter
              label: 隐藏 ALTCHA 页脚
              value: false
            - $formkit: text
              if: "$get(captchaEnable).value === true && $get(type).value === TURNSTILE"
              name: turnstileSiteKey
              key: turnstileSiteKey
              label: Turnstile Site Key
              validation: required
            - $formkit: secret
              if: "$get(captchaEnable).value === true && $get(type).value === TURNSTILE"
              name: turnstileSecretRef
              label: Turnstile Secret Key
              key: turnstileSecretRef
              descriptionPreset: 评论组件 Cloudflare Turnstile 验证密钥
              requiredKeys:
                - key: secretKey
                  help: 填入 Cloudflare Turnstile 提供的 Secret Key。
              validation: required
              help: 创建或选择包含 secretKey 的密钥，填入 Cloudflare 提供的 Secret Key。
            - $formkit: number
              if: "$get(captchaEnable).value === true && $get(type).value === ALPHANUMERIC"
              name: captchaLength
              key: captchaLength
              label: 验证码长度
              help: 字母数字组合验证码长度，不宜过长或过短，建议4-6位
              max: 8
              value: 4
              validation: required
            - $formkit: radio
              if: "$get(captchaEnable).value === true && $get(type).value === ALPHANUMERIC"
              name: ignoreCase
              key: ignoreCase
              label: 是否忽略验证码大小写验证
              help: 忽略大小写验证码，建议开启
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
            - $formkit: number
              if: "$get(captchaEnable).value === true && $get(type).value === ARITHMETIC"
              name: arithmeticRange
              key: arithmeticRange
              label: 计算范围
              help: 算术验证码计算范围
              value: 90
              validation: required
    - group: avatar
      label: 头像设置
      formSchema:
        - $formkit: checkbox
          label: 是否启用第三方头像
          name: enable
          id: enable
          key: enable
          value: false
        - $formkit: select
          label: 头像服务提供者
          if: "$get(enable).value === true"
          name: provider
          options:
            - label: "Gravatar"
              value: "gravatar"
          value: "gravatar"
        - $formkit: text
          label: 头像服务镜像地址
          if: "$get(enable).value === true"
          name: providerMirror
          value: ""
          help: 使用官方源则留空, 示例：https://gravatar.com
        - $formkit: select
          label: 头像策略
          if: "$get(enable).value === true"
          name: policy
          options:
            - label: "仅匿名用户"
              value: "anonymousUser"
            - label: "所有用户"
              value: "allUser"
            - label: "匿名&无头像用户"
              value: "noAvatarUser"
          value: "anonymousUser"
    - group: editor
      label: 编辑器
      formSchema:
        - $formkit: checkbox
          name: enableEmoji
          label: 启用表情选择器
          help: 控制评论和回复输入框中的表情按钮，不影响已有评论中的表情
          value: true
        - $formkit: text
          name: placeholder
          label: 自定义评论框占位符
        - $formkit: checkbox
          name: enableUpload
          id: enableUpload
          key: enableUpload
          label: 启用媒体上传
          value: false
        - $formkit: group
          if: "$get(enableUpload).value === true"
          name: upload
          label: 媒体上传配置
          children:
            - $formkit: checkbox
              name: allowAnonymous
              label: 允许匿名用户上传
              value: false
            - $formkit: group
              name: attachment
              label: 附件配置
              help: 出于安全考虑，建议为所选存储策略限制文件类型和大小，以免被恶意上传文件
              children:
                - $formkit: attachmentPolicySelect
                  name: attachmentPolicy
                  label: 存储策略
                - $formkit: attachmentGroupSelect
                  name: attachmentGroup
                  label: 存储组
